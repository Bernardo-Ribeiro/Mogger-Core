<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mogger Core — estudos tipográficos</title>
  <desc id="desc">Três direções tipográficas para acompanhar o mascote desenhado em estilo Paint.</desc>
  <rect width="1500" height="1080" fill="#F3F4F1"/>
  <text x="72" y="78" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="5" fill="#555B5F">MOGGER CORE  /  ESTUDO DE TIPOGRAFIA</text>
  <text x="72" y="126" font-family="Noto Sans, Arial, sans-serif" font-size="38" font-weight="800" fill="#171A1D">Três caminhos para acompanhar o traço do mascote</text>
  <text x="72" y="165" font-family="Noto Sans, Arial, sans-serif" font-size="19" fill="#555B5F">O desenho Paint continua como protagonista; a palavra entra como assinatura da equipe.</text>

  <g>
    <rect x="55" y="205" width="440" height="815" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="82" y="248" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#65A900">A  /  MARCADOR TECH</text>
    <text x="82" y="281" font-family="Noto Sans, Arial, sans-serif" font-size="16" fill="#555B5F">Mais manual, com energia de desenho feito no Paint.</text>
    <path d="M110 430q35-14 72 1t77-1t75 2t87-3M114 461q35-7 72 2t75-2t80 2t81-3" fill="none" stroke="#171A1D" stroke-width="8" stroke-linecap="round"/>
    <path d="M194 445q29-9 58 0t58 0" fill="none" stroke="#B7FF00" stroke-width="9" stroke-linecap="round"/>
    <path d="M86 550H464" stroke="#B7FF00" stroke-width="8"/>
    <text x="275" y="670" text-anchor="middle" font-family="FantasqueSansM Nerd Font Propo, DejaVu Sans, sans-serif" font-size="69" font-weight="700" letter-spacing="-2" fill="#171A1D" stroke="#171A1D" stroke-width="2.5" paint-order="stroke" transform="rotate(-1.5 275 646)">MOGGER</text>
    <text x="275" y="758" text-anchor="middle" font-family="FantasqueSansM Nerd Font Propo, DejaVu Sans, sans-serif" font-size="69" font-weight="700" letter-spacing="2" fill="#65A900" stroke="#65A900" stroke-width="2.5" paint-order="stroke" transform="rotate(1 275 735)">CORE</text>
    <text x="275" y="840" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="17" fill="#555B5F">A mais próxima da personalidade do mascote</text>
  </g>

  <g>
    <rect x="530" y="205" width="440" height="815" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="557" y="248" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#65A900">B  /  CORRIDA ANGULAR</text>
    <text x="557" y="281" font-family="Noto Sans, Arial, sans-serif" font-size="16" fill="#555B5F">Condensada e inclinada, com ritmo de pista.</text>
    <path d="M610 440h190M637 468h230M585 496h150" fill="none" stroke="#171A1D" stroke-width="10" stroke-linecap="square"/>
    <path d="M781 468h84" stroke="#B7FF00" stroke-width="10" stroke-linecap="square"/>
    <path d="M561 550H939" stroke="#B7FF00" stroke-width="8"/>
    <g transform="skewX(-8)">
      <text x="750" y="670" text-anchor="middle" font-family="Roboto Condensed, DejaVu Sans Condensed, sans-serif" font-size="74" font-weight="900" letter-spacing="-2" fill="#171A1D">MOGGER</text>
      <text x="750" y="758" text-anchor="middle" font-family="Roboto Condensed, DejaVu Sans Condensed, sans-serif" font-size="74" font-weight="900" letter-spacing="2" fill="#65A900">CORE</text>
    </g>
    <path d="M605 790h60l18-14h70" fill="none" stroke="#171A1D" stroke-width="7" stroke-linecap="square"/>
    <text x="750" y="840" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="17" fill="#555B5F">Mais esportiva e fácil de ler em movimento</text>
  </g>

  <g>
    <rect x="1005" y="205" width="440" height="815" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="1032" y="248" font-family="Noto Sans, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#65A900">C  /  BLOCO BASED</text>
    <text x="1032" y="281" font-family="Noto Sans, Arial, sans-serif" font-size="16" fill="#555B5F">Pesada, quadrada e segura, como o robô.</text>
    <path d="M1085 445h110v22h55v-22h110M1085 478h55v15h80v-15h140" fill="none" stroke="#171A1D" stroke-width="8" stroke-linejoin="round"/>
    <circle cx="1094" cy="445" r="8" fill="#B7FF00"/><circle cx="1350" cy="493" r="8" fill="#B7FF00"/>
    <path d="M1036 550H1414" stroke="#B7FF00" stroke-width="8"/>
    <text x="1225" y="670" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="68" font-weight="900" letter-spacing="-3" fill="#171A1D" stroke="#171A1D" stroke-width="1">MOGGER</text>
    <text x="1225" y="758" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="1" fill="#65A900">CORE</text>
    <path d="M1065 790h320" stroke="#171A1D" stroke-width="5"/>
    <text x="1225" y="840" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="17" fill="#555B5F">Mais legível e robusta em adesivo pequeno</text>
  </g>
</svg>
