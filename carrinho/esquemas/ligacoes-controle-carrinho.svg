<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#F5F7F2"/>
<style>text{font-family:Arial,sans-serif;fill:#171A1D}.title{font-size:38px;font-weight:bold}.subtitle{font-size:21px;fill:#171A1D}.head{font-size:25px;font-weight:bold;fill:#A6FF00}.label{font-size:22px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.wire{stroke:#171A1D;stroke-width:4;fill:none}.panel{fill:white;stroke:#C7CDD1;stroke-width:2}.box{fill:#F5F7F2;stroke:#C7CDD1;stroke-width:2}</style>
<text x="50" y="62" class="title">Mogger Core — Ligações do controle e carrinho</text>
<text x="50" y="96" class="subtitle">Diagrama funcional baseado no firmware • confirmar a montagem e as fontes de alimentação</text>
<rect x="40" y="125" width="735" height="625" rx="18" class="panel"/><rect x="825" y="125" width="735" height="625" rx="18" class="panel"/>
<rect x="40" y="125" width="735" height="55" rx="18" fill="#171A1D"/><rect x="825" y="125" width="735" height="55" rx="18" fill="#171A1D"/>
<text x="65" y="161" class="head">CONTROLE — Arduino Uno TX</text><text x="850" y="161" class="head">CARRINHO — Arduino Uno RX</text>
<rect x="65" y="215" width="260" height="175" rx="12" class="box"/><text x="85" y="250" class="label">Joystick e botões</text><text x="85" y="285" class="body">X → A0   •   Y → A1</text><text x="85" y="320" class="body">A–F → D2–D7</text><text x="85" y="355" class="body">Clique → D8</text>
<rect x="385" y="215" width="250" height="175" rx="12" class="box"/><text x="410" y="250" class="label">Arduino Uno TX</text><text x="410" y="290" class="body">Lê joystick e botões</text><text x="410" y="325" class="body">Envia comandos</text><path d="M325 300 H385" class="wire"/>
<rect x="230" y="480" width="360" height="180" rx="12" class="box"/><text x="250" y="515" class="label">Rádio nRF24L01+ TX</text><text x="250" y="550" class="body">CE D9*  •  CSN D10*</text><text x="250" y="585" class="body">MOSI D11  •  MISO D12</text><text x="250" y="620" class="body">SCK D13  •  VCC 3,3 V  •  GND</text><path d="M510 390 V435 H410 V480" class="wire"/>
<rect x="1030" y="210" width="340" height="160" rx="12" class="box"/><text x="1050" y="245" class="label">Rádio nRF24L01+ RX</text><text x="1050" y="280" class="body">CE D9  •  CSN D8</text><text x="1050" y="315" class="body">MOSI D11  •  MISO D12</text><text x="1050" y="350" class="body">SCK D13  •  VCC 3,3 V  •  GND</text>
<rect x="1040" y="430" width="300" height="110" rx="12" class="box"/><text x="1060" y="465" class="label">Arduino Uno RX</text><text x="1060" y="500" class="body">Recebe e aplica comandos</text><path d="M1190 370 V430" class="wire"/>
<rect x="850" y="590" width="385" height="125" rx="12" class="box"/><text x="870" y="625" class="label">Ponte H L298N → motores A e B</text><text x="870" y="660" class="body">D7 ENA • D6 IN1 • D5 IN2</text><text x="870" y="690" class="body">D4 IN3 • D3 IN4 • D2 ENB</text><path d="M1100 540 V590" class="wire"/>
<rect x="1270" y="590" width="250" height="125" rx="12" class="box"/><text x="1290" y="625" class="label">Servo SG90</text><text x="1290" y="660" class="body">D10 → sinal</text><text x="1290" y="690" class="body">Direção: eixo X</text><path d="M1270 540 V565 H1395 V590" class="wire"/>
<path d="M590 565 H710 V400 H890 V290 H1030" stroke="#171A1D" stroke-width="4" stroke-dasharray="12 9" fill="none"/><rect x="690" y="365" width="200" height="60" rx="8" fill="#A6FF00" stroke="#171A1D"/><text x="706" y="390" class="small">Enlace sem fio</text><text x="706" y="413" class="small">Canal 76 • 250 kbps</text>
<rect x="40" y="775" width="1520" height="225" rx="15" fill="#F5F7F2" stroke="#A6FF00" stroke-width="2"/><text x="65" y="815" class="label">Notas para montagem</text><text x="65" y="852" class="body">* CE e CSN do TX dependem da shield: confirme os pinos reais antes de conectar.</text><text x="65" y="885" class="body">Rádios: alimentação regulada de 3,3 V; nunca ligar VCC diretamente a 5 V.</text><text x="65" y="918" class="body">Compartilhe o GND entre cada Arduino e suas fontes/componentes; dimensione as fontes do rádio, servo e motores.</text><text x="65" y="951" class="body">Após 1 s sem pacotes, o RX para os motores e centraliza o servo. Veja o README para detalhes e limites.</text>
</svg>