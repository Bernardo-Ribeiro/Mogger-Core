<svg xmlns="http://www.w3.org/2000/svg" width="1630" height="1080" viewBox="0 0 1630 1080" role="img" aria-labelledby="title desc">
  <title id="title">Mogger Core — variações tipográficas do conceito C</title>
  <desc id="desc">Quatro explorações de fonte mantendo a composição em bloco do conceito C.</desc>
  <rect width="1630" height="1080" fill="#F3F4F1"/>
  <text x="72" y="78" font-family="Noto Sans, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="5" fill="#555B5F">MOGGER CORE  /  ESTUDO 02</text>
  <text x="72" y="126" font-family="Noto Sans, Arial, sans-serif" font-size="38" font-weight="800" fill="#171A1D">Variações de fonte sobre o conceito C</text>
  <text x="72" y="165" font-family="Noto Sans, Arial, sans-serif" font-size="19" fill="#555B5F">Mesma composição e paleta; muda o desenho das letras. Exploração inspirada na categoria Techno do DaFont.</text>

  <g>
    <rect x="48" y="210" width="370" height="810" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="72" y="255" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.4" fill="#65A900">01  /  GEOMÉTRICA</text>
    <text x="72" y="289" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Ampla, limpa e futurista</text>
    <path d="M95 465h276" stroke="#171A1D" stroke-width="9"/>
    <path d="M145 484h176" stroke="#B7FF00" stroke-width="9"/>
    <path d="M72 560h322" stroke="#B7FF00" stroke-width="7"/>
    <text x="233" y="676" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="1" fill="#171A1D">MOGGER</text>
    <text x="233" y="752" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="3" fill="#65A900">CORE</text>
    <text x="233" y="834" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Lembra Ethnocentric</text>
    <text x="233" y="870" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">sem copiar a fonte</text>
  </g>

  <g>
    <rect x="448" y="210" width="370" height="810" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="472" y="255" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.4" fill="#65A900">02  /  TECHNO PESADA</text>
    <text x="472" y="289" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Mais larga, com presença de emblema</text>
    <path d="M495 465h276M495 484h185" stroke="#171A1D" stroke-width="9" stroke-linecap="square"/>
    <path d="M681 484h90" stroke="#B7FF00" stroke-width="9"/>
    <path d="M472 560h322" stroke="#B7FF00" stroke-width="7"/>
    <text x="633" y="676" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1.5" fill="#171A1D">MOGGER</text>
    <text x="633" y="752" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="#65A900">CORE</text>
    <text x="633" y="834" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Lembra Good Times</text>
    <text x="633" y="870" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">sem copiar a fonte</text>
  </g>

  <g>
    <rect x="848" y="210" width="370" height="810" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="872" y="255" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.4" fill="#65A900">03  /  MONO CIRCUITO</text>
    <text x="872" y="289" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Modular, técnico e distintivo</text>
    <path d="M895 455h225v25h-225M895 494h175" fill="none" stroke="#171A1D" stroke-width="9"/>
    <circle cx="1120" cy="455" r="8" fill="#B7FF00"/>
    <path d="M872 560h322" stroke="#B7FF00" stroke-width="7"/>
    <text x="1033" y="676" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="42" font-weight="800" letter-spacing="-2" fill="#171A1D">MOGGER</text>
    <text x="1033" y="752" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="52" font-weight="800" letter-spacing="1" fill="#65A900">CORE</text>
    <text x="1033" y="834" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Mais técnico, lembra painel</text>
    <text x="1033" y="870" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">eletrônico</text>
  </g>

  <g>
    <rect x="1248" y="210" width="334" height="810" rx="18" fill="#FFFFFF" stroke="#CFD2CE" stroke-width="2"/>
    <text x="1272" y="255" font-family="Noto Sans, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.2" fill="#65A900">04  /  RACING</text>
    <text x="1272" y="289" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Condensada e inclinada</text>
    <path d="M1295 455h238M1315 484h198M1280 513h155" stroke="#171A1D" stroke-width="9" stroke-linecap="square"/>
    <path d="M1445 484h68" stroke="#B7FF00" stroke-width="9"/>
    <path d="M1272 560h286" stroke="#B7FF00" stroke-width="7"/>
    <g transform="skewX(-8)">
      <text x="1415" y="676" text-anchor="middle" font-family="Roboto Condensed, DejaVu Sans Condensed, sans-serif" font-size="53" font-weight="900" letter-spacing="-2.5" fill="#171A1D">MOGGER</text>
      <text x="1415" y="752" text-anchor="middle" font-family="Roboto Condensed, DejaVu Sans Condensed, sans-serif" font-size="61" font-weight="900" letter-spacing="1" fill="#65A900">CORE</text>
    </g>
    <text x="1415" y="834" text-anchor="middle" font-family="Noto Sans, Arial, sans-serif" font-size="15" fill="#555B5F">Mais agressiva na pista</text>
  </g>

  <text x="72" y="1050" font-family="Noto Sans, Arial, sans-serif" font-size="14" fill="#555B5F">Amostras de direção tipográfica. As letras finais serão ajustadas e convertidas em contornos vetoriais.</text>
</svg>
